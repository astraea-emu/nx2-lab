name: E3 original HBX stage-1 guest execution (Linux research)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/e3-hbx-original-stage1.yml'
      - 'tools/reference/hblauncher/**'
      - 'docs/STATUS.md'
      - 'docs/research/hblauncher_original_guest_2026-10-29.md'
permissions:
  contents: read
jobs:
  hbx-original-stage1:
    name: NX2 executes original HBX stage 1
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned source build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build git clang libboost-dev python3 \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross qemu-user
      - name: Freeze independent HBLauncher and Dynarmic revisions
        env:
          HBX_SHA: 18b4748ba98eeac7df17beb5d3418985eb74897c
          DYNARMIC_SHA: a46601580d5512d324104f985b5f0209dc980ddc
        run: |
          set -euo pipefail
          git clone https://github.com/ravensclawx/HBLauncher.git "$RUNNER_TEMP/hblauncher"
          git -C "$RUNNER_TEMP/hblauncher" checkout --detach "$HBX_SHA"
          test "$(git -C "$RUNNER_TEMP/hblauncher" rev-parse HEAD)" = "$HBX_SHA"
          test "$(git -C "$RUNNER_TEMP/hblauncher" hash-object apps/hello-cpu/src/app.c)" = 0513fa7d0b333ffdde2ee985f65900ee7f8f7e65
          test "$(git -C "$RUNNER_TEMP/hblauncher" hash-object sdk/abi.json)" = c143bba98182d22240bfbc692ebc2dbaa3059c9d
          test "$(git -C "$RUNNER_TEMP/hblauncher" hash-object sdk/tools/hbx-build.py)" = a270514d010049dac1304cc7da25d63896e3bb99
          test "$(git -C "$RUNNER_TEMP/hblauncher" hash-object sdk/src/crt0.S)" = 527bd97390b9ea607b4e109fa1850c580bfd2206
          test -z "$(git -C "$RUNNER_TEMP/hblauncher" status --porcelain)"
          grep -Fxq 'MIT License' "$RUNNER_TEMP/hblauncher/LICENSE"
          git clone https://github.com/azahar-emu/dynarmic.git "$RUNNER_TEMP/dynarmic"
          git -C "$RUNNER_TEMP/dynarmic" checkout --detach "$DYNARMIC_SHA"
          test "$(git -C "$RUNNER_TEMP/dynarmic" rev-parse HEAD)" = "$DYNARMIC_SHA"
          git -C "$RUNNER_TEMP/dynarmic" submodule update --init --recursive
          test -z "$(git -C "$RUNNER_TEMP/dynarmic" status --porcelain)"
      - name: Compile original unchanged Hello CPU HBX native image
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/hblauncher"
          python3 sdk/tools/hbx-build.py apps/hello-cpu \
            --out "$RUNNER_TEMP/hbx-stage1" --clean
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'hbx-stage1'
          report=json.loads((root/'report.json').read_text())
          assert report['format']=='hblauncher-native-app/1'
          assert report['id']=='hello-cpu' and report['abi']==3
          assert report['kind']=='native'
          for name, label in [('code.bin','codeSha256'),('data.bin','dataSha256')]:
              raw=(root/name).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==report[label]
          code_base=int(report['codeBase'],16)
          entry=int(report['hbxAppMain'],16)
          assert code_base<=entry<code_base+report['codeBytes']
          assert report['dataRegionBytes']>=report['dataBytes']
          assert report['codeBytes'] <= 2*1024*1024
          assert report['dataRegionBytes'] <= 2*1024*1024
          print('HBX_ORIGINAL_NATIVE_IMAGE_VERIFIED')
          print('original_code_sha256='+report['codeSha256'])
          print('original_data_sha256='+report['dataSha256'])
          print('original_hbx_app_main='+report['hbxAppMain'])
          print('guest_horizon_abi=not_claimed')
          PY
      - name: Attest unchanged generated HBX image and reject malformed manifests
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/hbx-stage1"
          python3 tools/reference/hblauncher/verify_generated_image.py \
            --report "$root/report.json" --code "$root/code.bin" \
            --data "$root/data.bin" | tee "$RUNNER_TEMP/hbx-image-admission.txt"
          grep -Fx 'NX2_HBX_ORIGINAL_IMAGE_ADMISSION_PASS' \
            "$RUNNER_TEMP/hbx-image-admission.txt"
          grep -Fx 'hbx_image_negative_cases=19' \
            "$RUNNER_TEMP/hbx-image-admission.txt"
          grep -Fx 'original_binary_admission=checked_against_pinned_builder_report' \
            "$RUNNER_TEMP/hbx-image-admission.txt"
      - name: Independently run the same original app object under QEMU AArch64
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/hbx-stage1"
          test -s "$root/app_c.o"
          test -s "$root/hbx_app.o"
          sha256sum "$root/app_c.o" > "$RUNNER_TEMP/hbx-app-object.sha256"
          aarch64-linux-gnu-gcc -static -no-pie -O2             -ffunction-sections -fdata-sections -Wl,--gc-sections             -I "$RUNNER_TEMP/hblauncher/sdk/include"             tools/reference/hblauncher/qemu_stage1_oracle.c             "$root/app_c.o" "$root/hbx_app.o" "$root/hbx_math.o"             "$root/hbx_ui_shaders.o" -lgcc             -o "$RUNNER_TEMP/hbx-stage1-qemu"
          sha256sum "$root/app_c.o" > "$RUNNER_TEMP/hbx-app-object-after.sha256"
          cmp "$RUNNER_TEMP/hbx-app-object.sha256"             "$RUNNER_TEMP/hbx-app-object-after.sha256"
          qemu-aarch64 "$RUNNER_TEMP/hbx-stage1-qemu" |
            tee "$RUNNER_TEMP/hbx-stage1-qemu.txt"
          for line in             'HBX_QEMU_ORIGINAL_STAGE1_ORACLE_PASS'             'hbx_original_valid_ret=0'             'hbx_original_bad_magic_ret=2'             'hbx_original_bad_version_ret=2'             'hbx_original_bad_size_ret=2'             'upstream_app_object=unchanged_hbx_build_output'             'horizon_services_executed=0'; do
            grep -Fx "$line" "$RUNNER_TEMP/hbx-stage1-qemu.txt"
          done
      - name: Build research-only NX2 Dynarmic guest adapter
        run: |
          cmake -S tools/reference/hblauncher \
            -B "$RUNNER_TEMP/nx2-e3-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DNX2_PINNED_DYNARMIC_SOURCE="$RUNNER_TEMP/dynarmic"
          cmake --build "$RUNNER_TEMP/nx2-e3-build" \
            --target nx2_hbx_stage1 --parallel 2
      - name: Execute unchanged external HBX app through NX2's checked guest runtime
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, os, subprocess
          temp=Path(os.environ['RUNNER_TEMP'])
          root=temp/'hbx-stage1'
          spec=json.loads((root/'report.json').read_text())
          exe=temp/'nx2-e3-build/nx2_hbx_stage1'
          args=[str(exe),str(root/'code.bin'),str(root/'data.bin'),
                spec['codeBase'],spec['dataBase'],spec['hbxAppMain'],
                str(spec['dataRegionBytes'])]
          run=subprocess.run(args,capture_output=True,text=True,timeout=20)
          print(run.stdout,end='')
          print(run.stderr,end='')
          if run.returncode:
              raise SystemExit('NX2 guest stage-1 failed: '+str(run.returncode))
          expected=[
              'NX2_HBX_STAGE1_ORIGINAL_GUEST_PASS',
              'hbx_original_valid_ret=0',
              'hbx_original_bad_magic_ret=2',
              'hbx_original_bad_version_ret=2',
              'hbx_original_bad_size_ret=2',
              'hbx_caller_stack_writes=0',
              'hbx_full_write_ledger=two_runs_equal',
              'hbx_rejected_bad_pointer=1',
              'hbx_rejected_no_stack_write=1',
              'hbx_rejected_bad_entry=1',
              'host_services_dispatched=0',
              'nintendo_horizon_calls=0',
              'switch2_hardware_observations=0',
          ]
          lines=run.stdout.splitlines()
          for line in expected:
              if line not in lines:
                  raise SystemExit('missing verified result: '+line)
          values=[int(line.split('=',1)[1]) for line in lines
                  if line.startswith('hbx_original_instructions_retired=')]
          if len(values)!=1 or not 2<=values[0]<=4096:
              raise SystemExit('missing genuine original AArch64 instruction progress')
          oracle = (temp/'hbx-stage1-qemu.txt').read_text().splitlines()
          keys = ('hbx_original_valid_ret', 'hbx_original_bad_magic_ret',
                  'hbx_original_bad_version_ret', 'hbx_original_bad_size_ret')
          def values(source):
              out = {}
              for line in source:
                  if '=' not in line:
                      continue
                  key, value = line.split('=', 1)
                  if key in keys:
                      if key in out:
                          raise SystemExit('duplicate stage-1 return field: '+key)
                      out[key] = value
              if set(out) != set(keys):
                  raise SystemExit('incomplete independent stage-1 comparison')
              return out
          if values(lines) != values(oracle):
              raise SystemExit('NX2/QEMU original HBX stage-1 results diverged')
          print('NX2_HBX_STAGE1_QEMU_ORACLE_PARITY_PASS')
          print('original_external_object_reused=yes')
          print('qemu_console_or_horizon_evidence=none')
          print('NX2_HBX_STAGE1_CI_ACCEPTED')
          # Execute the *original* HBX _start trampoline using the same
          # untouched code/data. NX2 independently checks caller SP/FP/LR.
          start_args = list(args)
          start_args[5] = spec['entry']
          start_result = subprocess.run(start_args, capture_output=True,
                                        text=True, timeout=20)
          print(start_result.stdout, end='')
          print(start_result.stderr, end='')
          if start_result.returncode or start_result.stderr.strip():
              raise SystemExit('original HBX _start guest execution refused')
          start_lines = start_result.stdout.splitlines()
          original_frame_effects = [
              int(line.split('=', 1)[1]) for line in start_lines
              if line.startswith('hbx_caller_stack_writes=')]
          if len(original_frame_effects) != 1 or \
             original_frame_effects[0] not in (1, 2) or \
             'hbx_full_write_ledger=two_runs_equal' not in start_lines:
              raise SystemExit('original HBX CRT0 stack effects not verified')
          if 'NX2_HBX_STAGE1_ORIGINAL_GUEST_PASS' not in start_lines:
              raise SystemExit('original HBX _start missing accepted return')
          if values(start_lines) != values(oracle):
              raise SystemExit('original HBX _start/QEMU return parity failed')
          start_counts = [
              int(line.split('=', 1)[1]) for line in start_lines
              if line.startswith('hbx_original_instructions_retired=')]
          direct_counts = [
              int(line.split('=', 1)[1]) for line in lines
              if line.startswith('hbx_original_instructions_retired=')]
          if len(start_counts) != 1 or len(direct_counts) != 1:
              raise SystemExit('original HBX _start instruction count missing')
          if not direct_counts[0] < start_counts[0] <= 4096:
              raise SystemExit('original HBX _start did not traverse CRT0')
          print('NX2_HBX_ORIGINAL_CRT0_ENTRY_PASS')
          print('hbx_crt0_original_instructions_retired='+str(start_counts[0]))
          print('hbx_crt0_return_sp_fp_lr=restored')
          print('hbx_crt0_caller_frame_bytes=source_defined_verified')
          print('hbx_original_image_mutations=19_rejected')
          print('hbx_write_ledger=fresh_runs_exactly_equal')
          print('original_hbx_qemu_stage1_return_parity=checked')

          PY
