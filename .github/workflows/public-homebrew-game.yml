name: Public SDL2 homebrew game baseline

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/public-homebrew-game.yml

permissions:
  contents: read

jobs:
  space-game:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out MIT-licensed Space Game NX source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: vgmoose/space-nx
          ref: d09ff27498a0baa2d4ab085ef3b4e3a9bc2fa75c
          path: space-game
          persist-credentials: false

      - name: Build original SDL2 homebrew game
        run: |
          test "$(git -C space-game rev-parse HEAD)" = d09ff27498a0baa2d4ab085ef3b4e3a9bc2fa75c
          docker pull devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
          docker run --rm --network none \
            -e DEVKITPRO=/opt/devkitpro -e DEVKITA64=/opt/devkitpro/devkitA64 \
            -v "$GITHUB_WORKSPACE/space-game:/source" -w /source \
            devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282 \
            make -f Makefile.libnx -j2 \
              'CFLAGS=-g -O2 -fpermissive -fcommon $(INCLUDE) -DSWITCH -D__LIBNX__ -DNOSTYLUS' \
              'LIBS=-lSDL2 -lEGL -lglapi -ldrm_nouveau -lnx -lm -lstdc++'
          test -s space-game/spacenx.nro

      - name: Obtain verified upstream emulator binary
        run: |
          curl -fL --retry 2 --max-time 240 \
            -o "$RUNNER_TEMP/lichii.tar.gz" \
            https://github.com/zortos293/Lichii/releases/download/build-160/lichii-linux-x86_64.tar.gz
          echo "8808893f08062c9a450234a3988eb2291dcda9d686a4d7e8780c0b6b6ec21962  $RUNNER_TEMP/lichii.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/upstream"
          tar -xzf "$RUNNER_TEMP/lichii.tar.gz" -C "$RUNNER_TEMP/upstream"
          test -x "$RUNNER_TEMP/upstream/lichii/eden-cli"

      - name: Run one bounded software-Vulkan game trial
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers xvfb xauth python3-pil imagemagick
          icds=(/usr/share/vulkan/icd.d/lvp*.json)
          test "${#icds[@]}" -eq 1
          mkdir -p "$RUNNER_TEMP/home"/{config,data,cache,runtime}
          chmod 700 "$RUNNER_TEMP/home/runtime"
          printf '[Renderer]\nbackend=1\nbackend\\default=false\n[Audio]\noutput_engine=3\noutput_engine\\default=false\n' > "$RUNNER_TEMP/runtime.ini"
          export HOME="$RUNNER_TEMP/home" XDG_CONFIG_HOME="$RUNNER_TEMP/home/config"
          export XDG_DATA_HOME="$RUNNER_TEMP/home/data" XDG_CACHE_HOME="$RUNNER_TEMP/home/cache"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/home/runtime"
          export VK_DRIVER_FILES="${icds[0]}" SDL_VIDEODRIVER=x11 SDL_AUDIODRIVER=dummy
          # SDL scancode A (4) maps to emulated controller A; the game uses it at "Start Game".
          export EDEN_NX2_KEY_SCRIPT="3:4,3.5:-4"
          export EDEN_NX2_FRAME_DUMP="$RUNNER_TEMP/frame-dump" EDEN_NX2_FRAME_DUMP_AT=1f
          set +e
          xvfb-run -a -s '-screen 0 1920x1080x24 -nolisten tcp' \
            bash -c '
              timeout --signal=TERM --kill-after=3s 15s "$@" &
              child=$!
              sleep 8
              import -window root "$RUNNER_TEMP/desktop.png" || true
              wait "$child"
            ' bash "$RUNNER_TEMP/upstream/lichii/eden-cli" \
            --config "$RUNNER_TEMP/runtime.ini" \
            --game "$GITHUB_WORKSPACE/space-game/spacenx.nro" \
            > "$RUNNER_TEMP/console.log" 2>&1
          printf '%s\n' "$?" > "$RUNNER_TEMP/exit.txt"
          exit 0

      - name: Inspect first completed game frame (no correctness claim)
        run: |
          /usr/bin/python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from PIL import Image

          root = Path(os.environ["RUNNER_TEMP"])
          images = sorted((root / "frame-dump").glob("*_present_*.png"))
          captures = []
          for image_file in images[:4]:
              with Image.open(image_file) as png:
                  rgb = png.convert("RGB")
                  color_counts = rgb.getcolors(maxcolors=2048)
                  captures.append({
                      "resolution": list(rgb.size),
                      "sha256": hashlib.sha256(image_file.read_bytes()).hexdigest(),
                      "unique_rgb_colors": len(color_counts) if color_counts is not None else ">2048",
                  })
          desktop_file = root / "desktop.png"
          desktop = None
          if desktop_file.is_file():
              with Image.open(desktop_file) as screenshot:
                  rgb = screenshot.convert("RGB")
                  nonblack = sum(any(channel > 8 for channel in pixel) for pixel in rgb.getdata())
                  desktop = {
                      "resolution": list(rgb.size),
                      "nonblack_fraction": round(nonblack / (rgb.width * rgb.height), 6),
                      "sha256": hashlib.sha256(desktop_file.read_bytes()).hexdigest(),
                  }
          with (root / "console.log").open("rb") as stream:
              log = stream.read(4 * 1024 * 1024 + 1)
          startup_flags = {
              "sdl_init_failed": b"SDL init failed" in log,
              "window_create_failed": b"window could not be created" in log,
              "guest_program_log_seen": b"initialized SDL" in log,
              "renderer_frame_dump_armed": b"Frame dump armed" in log,
              "frontend_a_press_logged": b"Key script: press key 4" in log,
          }
          report = {
              "scope": "MIT-licensed Switch 1 SDL2 space game; upstream baseline only",
              "input_attempt": "one emulated A press at 3.0 s, released at 3.5 s; gameplay not assumed",
              "desktop": desktop,
              "startup_flags": startup_flags,
              "log_bounded": len(log) <= 4 * 1024 * 1024,
              "game_source_sha": "d09ff27498a0baa2d4ab085ef3b4e3a9bc2fa75c",
              "upstream_sha": "2eb5f081c8734affd272466f89133aa4e3e56e18",
              "nro_sha256": hashlib.sha256(
                  (Path(os.environ["GITHUB_WORKSPACE"]) / "space-game/spacenx.nro").read_bytes()
              ).hexdigest(),
              "process_exit": int((root / "exit.txt").read_text().strip()),
              "present_images": captures,
              "pixel_correctness_verified": False,
              "input_verified": False,
          }
          print(json.dumps(report, sort_keys=True))
          (root / "space-game-summary.json").write_text(json.dumps(report, indent=2) + "\n")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as out:
              out.write("### Space Game NX — bounded upstream game baseline\n\n")
              out.write("~~~json\n" + json.dumps(report, indent=2) + "\n~~~\n")
              out.write("Presence of a capture is not proof of correct gameplay, input or Switch 2 compatibility.\n")
          print("GAME_FRAME_STATUS=" + ("vulkan_capture" if captures else "not_captured"))
          # A desktop image or Vulkan dump alone does not establish game correctness.
          PY

      - name: Preserve only public-domain frame images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: space-game-upstream-baseline
          path: |
            ${{ runner.temp }}/space-game-summary.json
            ${{ runner.temp }}/frame-dump/*_present_*.png
            ${{ runner.temp }}/desktop.png
          if-no-files-found: warn
          retention-days: 2
