name: P0 pinned modern engines original ARM64 ExeFS qualification
on:
  pull_request:
    paths:
      - '.github/workflows/p0-engine-original-exefs.yml'
      - 'tools/reference/eden_ns2/engine_source_preflight.py'
      - 'tools/reference/eden_ns2/smoke_candidate_exefs.py'
      - 'tools/reference/eden_ns2/test_engine_qualification.py'
      - 'tools/reference/eden_ns2/modern_exit_overlay.py'
      - 'tools/reference/eden_ns2/test_modern_exit_overlay.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: modern-engine-exefs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  original-guest:
    name: Original ExeFS (${{ matrix.engine }})
    runs-on: ubuntu-26.04
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix:
        engine: [eglantine, lichii]
    env:
      ENGINE: ${{ matrix.engine }}
    steps:
      - name: Checkout NX2 original fixtures and verification tools
        uses: actions/checkout@v4
        with:
          path: nx2
          persist-credentials: false
      - name: Checkout frozen Eglantine source
        if: matrix.engine == 'eglantine'
        uses: actions/checkout@v4
        with:
          repository: Eglantine-Community/Eglantine
          ref: 78743f30c251f66bd77e6eea6c28d8632d642d6f
          path: candidate
          persist-credentials: false
          submodules: false
      - name: Checkout frozen Lichii source
        if: matrix.engine == 'lichii'
        uses: actions/checkout@v4
        with:
          repository: zortos293/Lichii
          ref: 7afad5494e650edfc169624be54e606f54b079ec
          path: candidate
          persist-credentials: false
          submodules: false
      - name: Verify offline positive and negative controls
        run: |
          set -euo pipefail
          python3 -m unittest discover -v -s nx2/tools/reference/eden_ns2 -p test_engine_qualification.py
      - name: Verify exact clean source and reviewed GPL objects
        run: |
          set -euo pipefail
          python3 nx2/tools/reference/eden_ns2/engine_source_preflight.py "$ENGINE" candidate \
            --output "$RUNNER_TEMP/candidate-source.json"
      - name: Install build and original ARM64 guest prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          read -r -a packages <<< "$(python3 nx2/tools/reference/eden_ns2/build_native_engine.py --print-packages)"
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends "${packages[@]}"
      - name: Apply exact-source reviewed guest-exit repair only in isolated checkout
        run: |
          set -euo pipefail
          python3 nx2/tools/reference/eden_ns2/modern_exit_overlay.py "$ENGINE" candidate
      - name: Restore source-compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/nx2-modern-ccache
          key: nx2-original-cli-${{ matrix.engine }}-ubuntu26-clang-${{ hashFiles('candidate/src/CMakeLists.txt') }}-v1
      - name: Build candidate headless emulator CLI with approved isolated exit repair
        env:
          CCACHE_DIR: ${{ runner.temp }}/nx2-modern-ccache
          CCACHE_MAXSIZE: 1G
          CCACHE_BASEDIR: ${{ github.workspace }}/candidate
        run: |
          set -euo pipefail
          cmake -S candidate -B "$RUNNER_TEMP/candidate-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DENABLE_QT=OFF -DYUZU_CMD=ON -DYUZU_ROOM=OFF -DYUZU_TESTS=OFF \
            -DBUILD_TESTING=OFF -DENABLE_OPENGL=OFF -DENABLE_WEB_SERVICE=OFF \
            -DENABLE_UPDATE_CHECKER=OFF -DENABLE_CUBEB=OFF -DENABLE_LIBUSB=OFF \
            -DENABLE_WERROR=OFF -DYUZU_USE_CPM=ON
          cmake --build "$RUNNER_TEMP/candidate-build" --target yuzu-cmd --parallel 2
          test -x "$RUNNER_TEMP/candidate-build/bin/eden-cli"
      - name: Save source-compiler cache after successful build
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/nx2-modern-ccache
          key: nx2-original-cli-${{ matrix.engine }}-ubuntu26-clang-${{ hashFiles('candidate/src/CMakeLists.txt') }}-v1
      - name: Execute NX2-owned ExeFS and negative malformed-META control
        run: |
          set -euo pipefail
          python3 nx2/tools/reference/eden_ns2/make_native_exefs.py --output "$RUNNER_TEMP/valid"
          cp -a "$RUNNER_TEMP/valid" "$RUNNER_TEMP/invalid"
          export NPDM="$RUNNER_TEMP/invalid/main.npdm"
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["NPDM"])
          original = p.read_bytes()
          assert original[:4] == b"META"
          p.write_bytes(b"NX2!" + original[4:])
          PY
          python3 nx2/tools/reference/eden_ns2/smoke_candidate_exefs.py \
            "$ENGINE" candidate "$RUNNER_TEMP/candidate-build" \
            "$RUNNER_TEMP/valid" "$RUNNER_TEMP/invalid" \
            --output "$RUNNER_TEMP/original-exefs.json" --seconds 30 --reviewed-exit-adapter
      - name: Upload redacted source and original guest receipts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nx2-original-exefs-${{ matrix.engine }}
          if-no-files-found: ignore
          retention-days: 3
          path: |
            ${{ runner.temp }}/candidate-source.json
            ${{ runner.temp }}/original-exefs.json
