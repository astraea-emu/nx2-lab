name: P0 Eden-NS2 original NRO guest-execution probe (Linux)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/p0-eden-nro-guest-probe.yml'
      - 'docs/research/eden_nro_guest_probe_2026-10-30.md'

permissions:
  contents: read

jobs:
  bounded-guest:
    runs-on: ubuntu-26.04
    timeout-minutes: 50
    steps:
      - name: Checkout NX2 without persistent credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install supported Linux compiler and CLI dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            clang cmake ninja-build autoconf automake libtool pkg-config nasm \
            g++ git python3 ca-certificates \
            libfmt-dev liblz4-dev nlohmann-json3-dev libzstd-dev \
            libssl-dev zlib1g-dev libboost-dev libboost-fiber-dev libboost-context-dev \
            libxbyak-dev libopus-dev libasound2-dev \
            libavcodec-dev libavfilter-dev libswscale-dev \
            libvulkan-dev vulkan-utility-libraries-dev \
            spirv-tools spirv-headers glslang-tools libsdl3-dev \
            libenet-dev libusb-1.0-0-dev libva-dev libvdpau-dev \
            libxext-dev libxkbcommon-dev
      - name: Fetch pinned Eden emulator code, not release binaries or console data
        env:
          EDEN_SHA: e2f285ab1ecd3a2475c2ccad66f23b06b94ead5c
        shell: bash
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/eden"
          git -C "$RUNNER_TEMP/eden" remote add origin https://github.com/0x2593/Eden-NS2.git
          git -C "$RUNNER_TEMP/eden" -c protocol.version=2 fetch --quiet \
            --no-tags --depth=1 --filter=blob:none origin "$EDEN_SHA"
          git -C "$RUNNER_TEMP/eden" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/eden" rev-parse HEAD)" = "$EDEN_SHA"
          test -f "$RUNNER_TEMP/eden/src/yuzu_cmd/yuzu.cpp"
          test -s "$RUNNER_TEMP/eden/LICENSE.txt"
          echo 'NX2_EDEN_ORIGINAL_SOURCE_PIN_PASS'
      - name: Apply only the previously measured Clang source-build correction
        shell: bash
        run: |
          set -euo pipefail
          export EDEN_SOURCE="$RUNNER_TEMP/eden"
          python3 - <<'PY'
          import os
          import pathlib
          import subprocess
          root = pathlib.Path(os.environ["EDEN_SOURCE"])
          name = "src/video_core/texture_cache/util.cpp"
          original = "94e841e8ea4e13beb547ecc1653b5088b770a166"
          actual = subprocess.check_output(
              ["git", "-C", str(root), "hash-object", name], text=True).strip()
          assert actual == original, f"Unexpected source blob: {actual}"
          file = root / name
          old = "const u64 segment_begin = u64{layer} * layer_stride + level_offset;"
          new = "const u64 segment_begin = static_cast<u64>(layer) * layer_stride + level_offset;"
          source = file.read_text()
          assert source.count(old) == 1
          assert "for (s32 layer = 0; layer < info.resources.layers; ++layer)" in source
          file.write_text(source.replace(old, new))
          PY
          git -C "$RUNNER_TEMP/eden" diff --check
          test "$(git -C "$RUNNER_TEMP/eden" diff --numstat)" = \
            "$(printf '1\t1\tsrc/video_core/texture_cache/util.cpp')"
          echo 'NX2_EDEN_ONE_LINE_BUILD_FIX_ONLY'
      - name: Obtain independently source-authored Switch 1 homebrew input at exact revision
        env:
          NEXO_SHA: 7fa73a5062e64370163a248d1a0b555272012c0f
          NRO_BLOB: bb0ee2a52acd303e7c800443163aa91900eabb58
        shell: bash
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/nexo"
          git -C "$RUNNER_TEMP/nexo" remote add origin https://github.com/NeXoNetwork/NeXo2-emu.git
          git -C "$RUNNER_TEMP/nexo" sparse-checkout set --no-cone \
            tests/generated/hello.nro tests/programs/nro_hello/main.c
          git -C "$RUNNER_TEMP/nexo" -c protocol.version=2 fetch --quiet \
            --no-tags --depth=1 --filter=blob:none origin "$NEXO_SHA"
          git -C "$RUNNER_TEMP/nexo" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/nexo" rev-parse HEAD)" = "$NEXO_SHA"
          test "$(git -C "$RUNNER_TEMP/nexo" hash-object tests/generated/hello.nro)" = "$NRO_BLOB"
          test "$(stat -c '%s' "$RUNNER_TEMP/nexo/tests/generated/hello.nro")" = 24636
          test -f "$RUNNER_TEMP/nexo/tests/programs/nro_hello/main.c"
          echo 'NX2_SOURCE_AUTHORED_NRO_VERIFIED'
      - name: Compile original Eden command-line emulator and CPU/HLE/GPU libraries
        shell: bash
        run: |
          set -euo pipefail
          cmake -S "$RUNNER_TEMP/eden" -B "$RUNNER_TEMP/eden-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DENABLE_QT=OFF -DENABLE_WEB_SERVICE=OFF -DENABLE_UPDATE_CHECKER=OFF \
            -DENABLE_CUBEB=OFF -DENABLE_LIBUSB=OFF -DYUZU_ROOM=OFF \
            -DENABLE_OPENGL=OFF -DYUZU_CMD=ON -DYUZU_TESTS=OFF \
            -DBUILD_TESTING=OFF -DENABLE_WERROR=OFF -DYUZU_USE_CPM=ON
          cmake --build "$RUNNER_TEMP/eden-build" --target yuzu-cmd --parallel 2
          test -x "$RUNNER_TEMP/eden-build/bin/yuzu-cmd"
          echo 'NX2_EDEN_CLI_INTEGRATED_COMPILE_PASS'
      - name: Run bounded valid and invalid NRO headless trials without console data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/xdg/config" "$RUNNER_TEMP/xdg/data" "$RUNNER_TEMP/xdg/cache"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/xdg/config"
          export XDG_DATA_HOME="$RUNNER_TEMP/xdg/data"
          export XDG_CACHE_HOME="$RUNNER_TEMP/xdg/cache"
          export HOME="$RUNNER_TEMP/xdg"
          export SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy
          export LIBGL_ALWAYS_SOFTWARE=1
          export EDEN_DUMP_THREADS_AT=3
          export EDEN_NX2_GUEST_PROBE=1
          export NRO="$RUNNER_TEMP/nexo/tests/generated/hello.nro"
          python3 - <<'PY'
          import os, pathlib
          src=pathlib.Path(os.environ["NRO"]).read_bytes()
          assert src[0x10:0x14] == b"NRO0"
          bad=bytearray(src)
          bad[0x10:0x14]=b"NX2!"
          pathlib.Path(os.environ["RUNNER_TEMP"],"bad-magic.nro").write_bytes(bad)
          PY
          binary="$RUNNER_TEMP/eden-build/bin/yuzu-cmd"
          set +e
          timeout --signal=TERM --kill-after=5s 22s "$binary" \
            --program nx2-source-probe --null-render --singlecore --game "$NRO" >"$RUNNER_TEMP/good-guest.log" 2>&1
          good_rc=$?
          timeout --signal=TERM --kill-after=5s 12s "$binary" \
            --null-render --singlecore --game "$RUNNER_TEMP/bad-magic.nro" >"$RUNNER_TEMP/bad-guest.log" 2>&1
          bad_rc=$?
          set -e
          echo "NX2_GOOD_NRO_PROCESS_EXIT=$good_rc"
          echo "NX2_BAD_NRO_PROCESS_EXIT=$bad_rc"
          echo '=== Bounded positive source-authored NRO: diagnostic lines ==='
          grep -Ei 'NRO|Homebrew|Loader|svc|thread|error|fault|Hola desde|Contador|fibonacci|Failed|NX2' \
            "$RUNNER_TEMP/good-guest.log" | tail -n 70 || true
          echo '=== Bounded malformed-NRO control: diagnostic lines ==='
          grep -Ei 'NRO|Homebrew|Loader|svc|thread|error|fault|Failed|NX2' \
            "$RUNNER_TEMP/bad-guest.log" | tail -n 35 || true
          test "$bad_rc" -ne 0
          test "$bad_rc" -ne 124
          test "$bad_rc" -ne 137
          if grep -Fq 'Hola desde un NRO en NeXo 2!' "$RUNNER_TEMP/good-guest.log"; then
            echo 'NX2_EDEN_GUEST_AUTHORED_DEBUG_STRING_OBSERVED'
          else
            echo 'NX2_EDEN_GUEST_EXECUTION_NOT_VERIFIED: expected original guest output absent'
            exit 1
          fi
          echo 'NX2_EDEN_SOURCE_AUTHORED_GUEST_EXECUTION_PASS'
          # Secondary, stricter original-program progression measurements. Absence
          # of later results is reported, not misrepresented as a full guest exit.
          for marker in             'Loader: X1='             'Contador (.data): 42'             'Suma en el heap: 499500'             'fibonacci(50) = 12586269025'             'Adios! (main devuelve -> svcExitProcess)'; do
            if grep -Fq "$marker" "$RUNNER_TEMP/good-guest.log"; then
              echo "NX2_EDEN_GUEST_MARKER_OBSERVED=$marker"
            else
              echo "NX2_EDEN_GUEST_MARKER_NOT_OBSERVED=$marker"
            fi
          done
