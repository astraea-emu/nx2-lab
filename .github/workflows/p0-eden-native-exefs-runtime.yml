name: P0 original native ExeFS end-to-end runtime probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p0-eden-native-exefs-runtime.yml'
      - 'tools/reference/eden_ns2/overlay_eden_exit.py'
  pull_request:
    paths:
      - '.github/workflows/p0-eden-native-exefs-runtime.yml'
      - 'tools/reference/eden_ns2/assess_native_exefs.py'
      - 'tools/reference/eden_ns2/test_assess_native_exefs.py'
      - 'tools/reference/eden_ns2/make_native_exefs.py'
      - 'tools/reference/eden_ns2/test_make_native_exefs.py'
      - 'tools/reference/eden_ns2/overlay_eden_exit.py'
      - 'tools/reference/eden_ns2/test_overlay_eden_exit.py'
      - 'tools/reference/eden_ns2/native_sm_probe.S'
      - 'tools/reference/eden_ns2/native_sm_probe.ld'
      - 'tools/reference/eden_ns2/make_native_ipc_exefs.py'
      - 'tools/reference/eden_ns2/test_make_native_ipc_exefs.py'
      - 'tools/reference/eden_ns2/assess_native_ipc.py'
      - 'tools/reference/eden_ns2/test_assess_native_ipc.py'
      - 'tools/reference/eden_ns2/native_vi2_probe.S'
      - 'tools/reference/eden_ns2/native_vi2_probe.ld'
      - 'tools/reference/eden_ns2/make_native_vi2_exefs.py'
      - 'tools/reference/eden_ns2/test_make_native_vi2_exefs.py'
      - 'tools/reference/eden_ns2/assess_native_vi2.py'
      - 'tools/reference/eden_ns2/test_assess_native_vi2.py'
      - 'tools/reference/eden_ns2/native_frame_probe.S'
      - 'tools/reference/eden_ns2/native_frame_probe.ld'
      - 'tools/reference/eden_ns2/make_native_frame_exefs.py'
      - 'tools/reference/eden_ns2/test_make_native_frame_exefs.py'
      - 'tools/reference/eden_ns2/assess_native_frame.py'
      - 'tools/reference/eden_ns2/test_assess_native_frame.py'
      - 'tools/reference/eden_ns2/run_native_frame.py'
permissions:
  contents: read
concurrency:
  group: native-exefs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  frozen-cli:
    runs-on: ubuntu-26.04
    timeout-minutes: 55
    env:
      CCACHE_DIR: ${{ github.workspace }}/eden-cxx-cache
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify original self-authored fixture and log assessor
        run: |
          set -euo pipefail
          python3 -m unittest discover -v -s tools/reference/eden_ns2 -p test_make_native_exefs.py
          python3 -m unittest discover -v -s tools/reference/eden_ns2 -p test_assess_native_exefs.py
          python3 -m unittest discover -v -s tools/reference/eden_ns2 -p test_overlay_eden_exit.py
          python3 -m unittest discover -v -s tools/reference/eden_ns2 -p test_assess_native_ipc.py
          python3 -m unittest discover -v -s tools/reference/eden_ns2 -p test_assess_native_vi2.py
          python3 -m unittest discover -v -s tools/reference/eden_ns2 -p test_assess_native_frame.py
          echo NX2_NATIVE_EXEFS_UNITS_PASS
      - name: Install frozen Eden command-line build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            ccache clang cmake ninja-build autoconf automake libtool pkg-config nasm \
            binutils-aarch64-linux-gnu \
            g++ git python3 ca-certificates libfmt-dev liblz4-dev nlohmann-json3-dev \
            libzstd-dev libssl-dev zlib1g-dev libboost-dev libboost-fiber-dev \
            libboost-context-dev libxbyak-dev libopus-dev libasound2-dev \
            libavcodec-dev libavfilter-dev libswscale-dev libvulkan-dev \
            vulkan-utility-libraries-dev spirv-tools spirv-headers glslang-tools \
            libsdl3-dev libenet-dev libusb-1.0-0-dev libva-dev libvdpau-dev \
            libxext-dev libxkbcommon-dev xvfb xauth mesa-vulkan-drivers vulkan-tools
      - name: Verify original ARM64 fixtures with a real assembler and linker
        shell: bash
        run: |
          set -euo pipefail
          command -v aarch64-linux-gnu-as
          command -v aarch64-linux-gnu-ld
          command -v aarch64-linux-gnu-objcopy
          aarch64-linux-gnu-as --version
          python3 -m unittest discover -v -s tools/reference/eden_ns2 -p test_make_native_ipc_exefs.py
          python3 -m unittest discover -v -s tools/reference/eden_ns2 -p test_make_native_vi2_exefs.py
          python3 -m unittest discover -v -s tools/reference/eden_ns2 -p test_make_native_frame_exefs.py
      - name: Restore bounded frozen-source compiler cache
        id: eden-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/eden-cxx-cache
          key: eden-cli-ubuntu26-clang-e2f285ab-v1-${{ github.sha }}
          restore-keys: |
            eden-cli-ubuntu26-clang-e2f285ab-v1-
      - name: Initialize bounded ccache
        shell: bash
        env:
          EDEN_CACHE_MATCHED_KEY: ${{ steps.eden-cache.outputs.cache-matched-key }}
          EDEN_CACHE_EXACT_HIT: ${{ steps.eden-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          ccache --max-size=1200M
          ccache --zero-stats
          echo "NX2_EDEN_CACHE matched_key=$EDEN_CACHE_MATCHED_KEY exact_hit=$EDEN_CACHE_EXACT_HIT"
          clang++ --version
      - name: Fetch the exact GPL Eden source revision (no external binaries)
        shell: bash
        env:
          EDEN_SHA: e2f285ab1ecd3a2475c2ccad66f23b06b94ead5c
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/eden"
          git -C "$RUNNER_TEMP/eden" remote add origin https://github.com/0x2593/Eden-NS2.git
          git -C "$RUNNER_TEMP/eden" -c protocol.version=2 fetch --quiet --no-tags \
            --depth=1 --filter=blob:none origin "$EDEN_SHA"
          git -C "$RUNNER_TEMP/eden" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/eden" rev-parse HEAD)" = "$EDEN_SHA"
          test -s "$RUNNER_TEMP/eden/LICENSE.txt"
          # The negative-control checker binds error 4 to this exact loader enum.
          test "$(git -C "$RUNNER_TEMP/eden" hash-object src/core/loader/loader.h)" = \
            d3c0230cb0637bbd227ba30b703960f0b50ecbb6
          echo NX2_NATIVE_EXEFS_FROZEN_SOURCE_PASS
      - name: Apply previously verified isolated C++ cast fix
        shell: bash
        run: |
          set -euo pipefail
          export EDEN_ROOT="$RUNNER_TEMP/eden"
          python3 - <<'PY'
          import pathlib,os,subprocess
          root=pathlib.Path(os.environ['EDEN_ROOT'])
          name='src/video_core/texture_cache/util.cpp'
          git_blob=subprocess.check_output(['git','-C',str(root),'hash-object',name],text=True).strip()
          assert git_blob=='94e841e8ea4e13beb547ecc1653b5088b770a166'
          old='const u64 segment_begin = u64{layer} * layer_stride + level_offset;'
          new='const u64 segment_begin = static_cast<u64>(layer) * layer_stride + level_offset;'
          file=root/name
          source=file.read_text()
          assert source.count(old)==1
          file.write_text(source.replace(old,new))
          PY
          git -C "$RUNNER_TEMP/eden" diff --check
          echo NX2_NATIVE_EXEFS_CAST_ONLY
      - name: Apply source-pinned process-exit and unloaded-image lifecycle repair
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/reference/eden_ns2/overlay_eden_exit.py "$RUNNER_TEMP/eden"
          echo NX2_NATIVE_EXEFS_ISOLATED_LIFECYCLE_REPAIR
      - name: Generate and hash original ExeFS and corrupt only negative NPDM magic
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/reference/eden_ns2/make_native_exefs.py --output "$RUNNER_TEMP/valid"
          test "$(sha256sum "$RUNNER_TEMP/valid/main" | cut -d' ' -f1)" = \
            508edcf6870546ed2f67c6ed11f0df3deb0242427ea2b9d7562ae6d015084ed5
          test "$(sha256sum "$RUNNER_TEMP/valid/main.npdm" | cut -d' ' -f1)" = \
            64e25a2e3e37495d75341f9564afa3e6a665f10f94b36ea7e4e3c533b4573148
          cp -a "$RUNNER_TEMP/valid" "$RUNNER_TEMP/invalid"
          export NPDM="$RUNNER_TEMP/invalid/main.npdm"
          python3 - <<'PY'
          import pathlib,os
          p=pathlib.Path(os.environ['NPDM'])
          b=bytearray(p.read_bytes())
          assert b[:4]==b'META'
          b[:4]=b'NX2!'
          p.write_bytes(b)
          PY
          echo NX2_NATIVE_EXEFS_PINNED_INPUTS_PASS
      - name: Assemble the original service-manager request and reply-checking guest
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/reference/eden_ns2/make_native_ipc_exefs.py --output "$RUNNER_TEMP/ipc"
          test "$(sha256sum "$RUNNER_TEMP/ipc/main" | cut -d' ' -f1)" = \
            97361663c3468646e453632f7febe3a37bd798e6f3fc2af985b793f21d2c3905
          test "$(sha256sum "$RUNNER_TEMP/ipc/main.npdm" | cut -d' ' -f1)" = \
            64e25a2e3e37495d75341f9564afa3e6a665f10f94b36ea7e4e3c533b4573148
          echo NX2_NATIVE_IPC_SOURCE_AUTHORED_INPUT_READY
      - name: Assemble the original VI2 lifecycle and notification-memory guest
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/reference/eden_ns2/make_native_vi2_exefs.py --output "$RUNNER_TEMP/vi2" \
            | tee "$RUNNER_TEMP/native-vi2-fixture.log"
          test "$(sha256sum "$RUNNER_TEMP/vi2/main" | cut -d' ' -f1)" = \
            8aa8dd0c26c45aeeb16d4ad5e50fd689a2559600c459e0c9c91c5f5d356b3876
          test "$(sha256sum "$RUNNER_TEMP/vi2/main.npdm" | cut -d' ' -f1)" = \
            64e25a2e3e37495d75341f9564afa3e6a665f10f94b36ea7e4e3c533b4573148
          echo NX2_NATIVE_VI2_SOURCE_AUTHORED_INPUT_READY
      - name: Build frozen Eden CLI with the explicit isolated lifecycle repair
        shell: bash
        run: |
          set -euo pipefail
          eden_configure_started=$SECONDS
          cmake -S "$RUNNER_TEMP/eden" -B "$RUNNER_TEMP/eden-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DENABLE_QT=OFF -DENABLE_WEB_SERVICE=OFF -DENABLE_UPDATE_CHECKER=OFF \
            -DENABLE_CUBEB=OFF -DENABLE_LIBUSB=OFF -DYUZU_ROOM=OFF \
            -DENABLE_OPENGL=OFF -DYUZU_CMD=ON -DYUZU_TESTS=OFF \
            -DBUILD_TESTING=OFF -DENABLE_WERROR=OFF -DYUZU_USE_CPM=ON
          echo "NX2_EDEN_TIMING configure_seconds=$((SECONDS - eden_configure_started))"
          cpu_count=$(nproc)
          build_jobs=$(( cpu_count < 2 ? cpu_count : 2 ))
          memory_kib=$(awk '/^MemTotal:/ { print $2 }' /proc/meminfo)
          available_memory_kib=$(awk '/^MemAvailable:/ { print $2 }' /proc/meminfo)
          if (( cpu_count >= 4 && memory_kib >= 14 * 1024 * 1024 && available_memory_kib >= 12 * 1024 * 1024 )); then
            build_jobs=4
          fi
          echo "NX2_EDEN_BUILD_RESOURCES cpu=$cpu_count memory_kib=$memory_kib available_kib=$available_memory_kib jobs=$build_jobs"
          eden_build_started=$SECONDS
          cmake --build "$RUNNER_TEMP/eden-build" --target yuzu-cmd --parallel "$build_jobs"
          echo "NX2_EDEN_TIMING build_seconds=$((SECONDS - eden_build_started))"
          test -x "$RUNNER_TEMP/eden-build/bin/eden-cli"
          ccache --show-stats
          echo NX2_NATIVE_EXEFS_REAL_EDEN_CLI_BUILT
      - name: Save compiler objects before runtime acceptance
        if: always() && steps.eden-cache.outputs.cache-primary-key != '' && steps.eden-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/eden-cxx-cache
          key: ${{ steps.eden-cache.outputs.cache-primary-key }}
      - name: Run bounded loader, SM and VI2 lifecycle controls
        shell: bash
        run: |
          set -euo pipefail
          eden_controls_started=$SECONDS
          trial() {
            local which="$1" logfile="$2"
            local trial_home="$RUNNER_TEMP/xdg-$which"
            mkdir -p "$trial_home/config" "$trial_home/data/eden/play_time" "$trial_home/cache"
            env HOME="$trial_home" XDG_CONFIG_HOME="$trial_home/config" \
              XDG_DATA_HOME="$trial_home/data" XDG_CACHE_HOME="$trial_home/cache" \
              SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy \
              LIBGL_ALWAYS_SOFTWARE=1 EDEN_NX2_HIDE_WINDOW=1 \
              timeout --signal=TERM --kill-after=4s 15s \
              "$RUNNER_TEMP/eden-build/bin/eden-cli" \
              --null-render --singlecore --game "$RUNNER_TEMP/$which/main" >"$logfile" 2>&1
          }
          set +e
          trial invalid "$RUNNER_TEMP/native-invalid.log"
          bad_rc=$?
          trial valid "$RUNNER_TEMP/native-valid.log"
          good_rc=$?
          trial ipc "$RUNNER_TEMP/native-ipc.log"
          ipc_rc=$?
          trial vi2 "$RUNNER_TEMP/native-vi2.log"
          vi2_rc=$?
          python3 tools/reference/eden_ns2/assess_native_exefs.py \
            --valid-log "$RUNNER_TEMP/native-valid.log" \
            --invalid-log "$RUNNER_TEMP/native-invalid.log" \
            --valid-exit "$good_rc" --invalid-exit "$bad_rc"
          baseline_check=$?
          python3 tools/reference/eden_ns2/assess_native_ipc.py \
            --log "$RUNNER_TEMP/native-ipc.log" --exit "$ipc_rc"
          ipc_check=$?
          python3 tools/reference/eden_ns2/assess_native_vi2.py \
            --log "$RUNNER_TEMP/native-vi2.log" --exit "$vi2_rc" \
            | tee "$RUNNER_TEMP/native-vi2-assessment.log"
          vi2_check=$?
          set -e
          test "$baseline_check" -eq 0
          test "$ipc_check" -eq 0
          test "$vi2_check" -eq 0
          echo "NX2_EDEN_TIMING controls_seconds=$((SECONDS - eden_controls_started))"
          echo NX2_NATIVE_BASELINE_IPC_AND_VI2_CONTROLS_PASS
      - name: Verify original and edited image pixels through real Vulkan capture
        shell: bash
        run: |
          set -euo pipefail
          dpkg-query --show xvfb xauth mesa-vulkan-drivers vulkan-tools libsdl3-0
          python3 tools/reference/eden_ns2/run_native_frame.py \
            --eden-cli "$RUNNER_TEMP/eden-build/bin/eden-cli" \
            --eden-source "$RUNNER_TEMP/eden" \
            --output "$RUNNER_TEMP/native-frame" --both \
            | tee "$RUNNER_TEMP/native-frame-result.log"
      - name: Preserve independent original runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-native-exefs-logs
          retention-days: 3
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/native-valid.log
            ${{ runner.temp }}/native-invalid.log
            ${{ runner.temp }}/native-ipc.log
            ${{ runner.temp }}/native-vi2.log
            ${{ runner.temp }}/native-vi2-assessment.log
            ${{ runner.temp }}/native-vi2-fixture.log
            ${{ runner.temp }}/native-frame-result.log
            ${{ runner.temp }}/native-frame/**/provenance.json
            ${{ runner.temp }}/native-frame/**/vulkan.log
            ${{ runner.temp }}/native-frame/**/*.xvfb
            ${{ runner.temp }}/native-frame/**/fixture.log
            ${{ runner.temp }}/native-frame/**/runtime.log
            ${{ runner.temp }}/native-frame/**/assessment.log
            ${{ runner.temp }}/native-frame/**/result.json
            ${{ runner.temp }}/native-frame/**/config.ini
            ${{ runner.temp }}/native-frame/**/native-latest-frame.tga
            ${{ runner.temp }}/native-frame/**/guest/main*
