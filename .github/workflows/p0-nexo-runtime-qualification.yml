name: P0 frozen NeXo runtime qualification (Linux)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/p0-nexo-runtime-qualification.yml'
      - 'tools/reference/nexo2/**'
      - 'docs/research/runtime_baseline_nexo2_2026-10-30.md'

permissions:
  contents: read

jobs:
  nexo-frozen-nro-qualification:
    name: Frozen external NRO load, execute and reject tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout NX2 (no persistent credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch public candidate at exact revision (no submodules)
        env:
          NEXO_SHA: 7fa73a5062e64370163a248d1a0b555272012c0f
          NRO_GIT_BLOB: bb0ee2a52acd303e7c800443163aa91900eabb58
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/NeXoNetwork/NeXo2-emu.git "$RUNNER_TEMP/nexo2"
          git -C "$RUNNER_TEMP/nexo2" checkout --detach "$NEXO_SHA"
          test "$(git -C "$RUNNER_TEMP/nexo2" rev-parse HEAD)" = "$NEXO_SHA"
          test "$(git -C "$RUNNER_TEMP/nexo2" hash-object tests/generated/hello.nro)" = "$NRO_GIT_BLOB"
          test -z "$(git -C "$RUNNER_TEMP/nexo2" status --porcelain --untracked-files=no)"
          test -s "$RUNNER_TEMP/nexo2/LICENSE"
          echo "NEXO_FROZEN_SOURCE_AND_NRO_VERIFIED"
          echo "candidate_revision=$NEXO_SHA"
          echo "nro_blob=$NRO_GIT_BLOB"
      - name: Inject independent NX2 test without vendoring external source
        shell: bash
        run: |
          set -euo pipefail
          printf '\ntarget_sources(nexo2_tests PRIVATE "%s")\n' \
            "$GITHUB_WORKSPACE/tools/reference/nexo2/nro_qualification.cpp" \
            >> "$RUNNER_TEMP/nexo2/CMakeLists.txt"
      - name: Configure CPU, loader and HLE only
        shell: bash
        run: |
          set -euo pipefail
          cmake -S "$RUNNER_TEMP/nexo2" -B "$RUNNER_TEMP/nexo-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DNEXO2_BUILD_APP=OFF -DNEXO2_BUILD_QT=OFF \
            -DNEXO2_BUILD_TESTS=ON -DNEXO2_ENABLE_JIT=OFF \
            -DNEXO2_ENABLE_VULKAN=OFF -DNEXO2_ENABLE_TLS=OFF
          grep -Fxq 'NEXO2_BUILD_APP:BOOL=OFF' "$RUNNER_TEMP/nexo-build/CMakeCache.txt"
          grep -Fxq 'NEXO2_ENABLE_JIT:BOOL=OFF' "$RUNNER_TEMP/nexo-build/CMakeCache.txt"
          grep -Fxq 'NEXO2_ENABLE_VULKAN:BOOL=OFF' "$RUNNER_TEMP/nexo-build/CMakeCache.txt"
          grep -Fxq 'NEXO2_ENABLE_TLS:BOOL=OFF' "$RUNNER_TEMP/nexo-build/CMakeCache.txt"
      - name: Compile actual candidate core and independent checks
        shell: bash
        run: |
          set -euo pipefail
          cmake --build "$RUNNER_TEMP/nexo-build" --target nexo2_tests --parallel 2
      - name: Execute unchanged third-party NRO in candidate runtime, with negatives
        shell: bash
        run: |
          set -euo pipefail
          NEXO2_TEST_FILTER=Nx2_ "$RUNNER_TEMP/nexo-build/nexo2_tests" --interp \
            | tee "$RUNNER_TEMP/nx2-nexo-result.log"
          for expected in \
            '[ OK ] Nx2_OriginalNroExecutesToExit' \
            '[ OK ] Nx2_NroRejectsDamagedImage' \
            '[ OK ] Nx2_UnsupportedSvcDoesNotPretendToSucceed'; do
            grep -Fx "$expected" "$RUNNER_TEMP/nx2-nexo-result.log"
          done
          grep -Eq '^3 tests, [1-9][0-9]* comprobaciones, 0 fallos$' "$RUNNER_TEMP/nx2-nexo-result.log"
          echo 'NX2_NEXO_RUNTIME_CONTROL_PASS'
      - name: Corroborate upstream original NRO loader tests
        shell: bash
        run: |
          set -euo pipefail
          NEXO2_TEST_FILTER=Nro_ "$RUNNER_TEMP/nexo-build/nexo2_tests" --interp \
            | tee "$RUNNER_TEMP/nexo-upstream-nro.log"
          grep -Fx '[ OK ] Nro_RejectsInvalidFiles' "$RUNNER_TEMP/nexo-upstream-nro.log"
          grep -Fx '[ OK ] Nro_HelloRunsToExit' "$RUNNER_TEMP/nexo-upstream-nro.log"
          grep -Eq '^[1-9][0-9]* tests, [1-9][0-9]* comprobaciones, 0 fallos$' "$RUNNER_TEMP/nexo-upstream-nro.log"
          echo 'NX2_NEXO_UPSTREAM_CORROBORATION_PASS'
